server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the ingress, absolute redirects would point at port 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # One page app: /set/<id> and share links (/s#…) all load index.html.
    # Browsers check for a newer copy on every visit, so a deploy shows up
    # straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
